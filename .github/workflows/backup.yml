name: Backup starccafe.com

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set backup name
        run: echo "STAMP=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_ENV"

      - name: Create Git bundle
        run: |
          mkdir -p backup
          git bundle create "backup/starccafe-repo_${STAMP}.bundle" --all

      - name: Zip current site files
        run: |
          zip -r "backup/starccafe-files_${STAMP}.zip" . -x ".git/*" "backup/*"

      - name: Snapshot the live site
        continue-on-error: true
        run: |
          mkdir -p snapshot
          cd snapshot
          wget --mirror --page-requisites --convert-links --adjust-extension --no-parent --wait=1 https://starccafe.com || true
          cd ..
          zip -r "backup/starccafe-live_${STAMP}.zip" snapshot

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: starccafe-backup-${{ env.STAMP }}
          path: backup/
          retention-days: 90
