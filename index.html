<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark-espresso">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarC Coffee | A Journey Through Coffee</title>
    <!-- Custom Favicon: Gold Star Logo -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cairo:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Default Palette: Clean Light Theme */
        :root {
            --bg-dark: #fbf9f5;
            --bg-card: #ffffff;
            --gold-primary: #a37c27;
            --gold-light: #523f14;
            --text-light: #2b2621;
            --text-muted: #6e655f;
            --border-gold: rgba(163, 124, 39, 0.25);
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --font-heading: 'Playfair Display', serif;
            --font-script: 'Alex Brush', cursive;
            --font-body: 'Poppins', sans-serif;
            --font-arabic: 'Cairo', sans-serif;
        }

        /* Dark Signature Warm Espresso Theme */
        [data-theme="dark-espresso"] {
            --bg-dark: #0a0604;
            --bg-card: #18100c;
            --gold-primary: #cba135;
            --gold-light: #ebd68a;
            --text-light: #fdfaf7;
            --text-muted: #b8a295;
            --border-gold: rgba(203, 161, 53, 0.4);
            --card-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Controls Container */
        .controls-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .action-btn {
            background: var(--bg-card);
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            padding: 6px 16px;
            cursor: pointer;
            color: var(--gold-primary);
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-decoration: none;
        }

        .action-btn:hover {
            background: var(--gold-primary);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(163, 124, 39, 0.3);
        }

        /* Dropdown Styles for Management Menu */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 5px;
            background-color: var(--bg-card);
            min-width: 140px;
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            z-index: 1001;
            padding: 6px;
            flex-direction: column;
            gap: 4px;
        }

        html[dir="rtl"] .dropdown-menu {
            right: auto;
            left: 0;
        }

        .dropdown.show .dropdown-menu {
            display: flex;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            color: var(--gold-primary);
            padding: 8px 12px;
            text-align: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .dropdown-item:hover {
            background: var(--gold-primary);
            color: #ffffff;
        }

        /* Dynamic Language Visibility Rules */
        .lang-ar, .item-title-ar, .item-desc-ar, .hero-tagline-ar {
            display: none;
        }

        .lang-en {
            display: inline;
        }

        html[dir="rtl"] .lang-en,
        html[dir="rtl"] .item-title-en,
        html[dir="rtl"] .item-desc-en,
        html[dir="rtl"] .hero-tagline {
            display: none;
        }

        html[dir="rtl"] .lang-ar,
        html[dir="rtl"] .item-title-ar,
        html[dir="rtl"] .item-desc-ar,
        html[dir="rtl"] .hero-tagline-ar {
            display: inline;
        }

        html[dir="rtl"] .item-title-ar,
        html[dir="rtl"] .item-desc-ar,
        html[dir="rtl"] .hero-tagline-ar {
            display: block;
        }

        /* Header & Hero */
        header {
            text-align: center;
            padding: 80px 20px 40px;
            background: radial-gradient(circle at center, rgba(163, 124, 39, 0.08) 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border-gold);
            transition: border-color 0.4s ease, background 0.4s ease;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-star {
            color: var(--gold-primary);
            font-size: 2.5rem;
            display: block;
            margin-bottom: -15px;
            transition: color 0.4s ease;
        }

        .logo-title {
            font-family: var(--font-script);
            font-size: 4.5rem;
            color: var(--gold-primary);
            line-height: 1;
            transition: color 0.4s ease;
        }

        .logo-subtitle {
            letter-spacing: 4px;
            font-size: 0.9rem;
            color: var(--text-light);
            text-transform: uppercase;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* Header Social Links */
        .header-socials {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .header-socials a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--border-gold);
            padding: 5px 14px;
            border-radius: 20px;
            background: var(--bg-card);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .header-socials a:hover {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-primary);
            transform: translateY(-2px);
        }

        .hero-tagline {
            max-width: 700px;
            margin: 0 auto;
            font-family: var(--font-heading);
            font-size: 1.3rem;
            color: var(--gold-light);
            font-style: italic;
            transition: color 0.4s ease;
        }

        .hero-tagline-ar {
            font-family: var(--font-arabic);
            font-size: 1.2rem;
            color: var(--gold-primary);
            margin-top: 20px;
            font-style: normal;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Menu Section */
        .section-title {
            text-align: center;
            font-family: var(--font-heading);
            font-size: 2.2rem;
            color: var(--gold-primary);
            margin-bottom: 30px;
            position: relative;
        }

        .section-title::after {
            content: '★';
            display: block;
            font-size: 1rem;
            margin-top: 5px;
            color: var(--gold-light);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-left: 3px solid var(--gold-primary);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--card-shadow);
            transition: all 0.4s ease;
        }

        .menu-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-3px);
        }

        .product-img-container {
            width: 100%;
            height: 220px;
            background-color: rgba(0,0,0,0.05);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .menu-card:hover .product-img {
            transform: scale(1.03);
        }

        .menu-card-body {
            padding: 20px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .item-title-en {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            color: var(--gold-light);
            font-weight: 600;
        }

        .item-title-ar {
            font-family: var(--font-arabic);
            font-size: 1.25rem;
            color: var(--gold-primary);
            font-weight: 700;
            width: 100%;
            text-align: right;
        }

        .item-desc-en {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .item-desc-ar {
            font-family: var(--font-arabic);
            font-size: 0.9rem;
            color: var(--text-muted);
            direction: rtl;
            text-align: right;
            line-height: 1.6;
        }

        /* Map Section */
        .map-section {
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .map-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .map-header-container .section-title {
            margin-bottom: 0;
            text-align: left;
        }

        .map-header-container .section-title::after {
            display: none;
        }

        .directions-btn {
            background: var(--bg-card);
            border: 1px solid var(--gold-primary);
            border-radius: 25px;
            padding: 10px 22px;
            color: var(--gold-primary);
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }

        .directions-btn:hover {
            background: var(--gold-primary);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(203, 161, 53, 0.4);
            transform: translateY(-2px);
        }

        .map-wrapper {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            border: 1px solid var(--border-gold);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-gold);
            margin-top: 60px;
            background: rgba(0,0,0,0.02);
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: border-color 0.4s ease;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .social-links a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            border: 1px solid var(--border-gold);
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-card);
        }

        .social-links a:hover {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-primary);
        }

        /* RTL Specifics */
        html[dir="rtl"] body {
            font-family: var(--font-arabic);
        }

        html[dir="rtl"] .controls-container {
            right: auto;
            left: 20px;
        }

        html[dir="rtl"] .menu-card {
            border-left: 1px solid var(--border-gold);
            border-right: 3px solid var(--gold-primary);
        }

        html[dir="rtl"] .map-header-container .section-title {
            text-align: right;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-title {
                font-size: 3.5rem;
            }
            .controls-container {
                top: 10px;
                right: 10px;
            }
            .map-header-container {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .map-header-container .section-title {
                text-align: center;
            }
        }
    </style>
</head>
