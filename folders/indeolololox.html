<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>StarC Cafe – Files</title>
<style>
:root{
  --ink:#17302d; --muted:#5d716e; --line:#d3dcda; --bg:#edf1f0; --card:#ffffff;
  --brand:#12403c; --brand-2:#1d5a54; --accent:#c8841a; --danger:#a63a2a; --ok:#2f7a4d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{background:var(--brand);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:1.15rem;font-weight:600}
.top a,.top button{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 12px;text-decoration:none;font-size:.9rem}
.top a:hover,.top button:hover{background:rgba(255,255,255,.12)}
.top .right{display:flex;gap:8px}

main{max-width:880px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}

/* Login */
#login{max-width:380px;margin:60px auto}
#login h2{margin:0 0 4px;font-size:1.3rem}
#login p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=password],input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn:hover{background:var(--brand-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.ghost:hover{background:#e3ecea}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.danger:hover{background:#f7e6e2}
.btn.small{padding:6px 12px;font-size:.9rem}
.msg{margin-top:12px;min-height:1.4em;font-size:.95rem}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

/* Upload zone */
#drop{border:2px dashed #9db3af;border-radius:12px;padding:32px 16px;text-align:center;background:#f8fbfa;transition:background .15s,border-color .15s}
#drop.over{background:#e5f0ee;border-color:var(--brand)}
#drop strong{display:block;font-size:1.1rem;margin-bottom:4px}
#drop span{color:var(--muted);font-size:.95rem}
#drop .btn{margin-top:14px}
#queue{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
#queue li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem}
#queue .bar{grid-column:1/-1;height:6px;background:#e1e8e6;border-radius:99px;overflow:hidden}
#queue .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
#queue li.done .bar i{background:var(--ok)}
#queue li.fail .bar i{background:var(--danger)}

/* List */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 10px;flex-wrap:wrap}
.list-head h2{margin:0;font-size:1.15rem}
.list-head input{max-width:260px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.85rem;color:var(--muted);font-weight:600;padding:0 10px 8px}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.name{word-break:break-word;font-weight:600}
td.meta{color:var(--muted);font-size:.92rem;white-space:nowrap}
td.actions{white-space:nowrap;text-align:right}
td.actions .btn{margin-left:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:640px){
  th.hide-s,td.hide-s{display:none}
  td.actions .btn{margin:4px 0 0 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="top">
  <h1>StarC Cafe · Files</h1>
  <div class="right">
    <a href="../services/index.html">Back to services</a>
    <button id="logout" hidden>Log out</button>
  </div>
</header>

<main>
  <!-- Login -->
  <section id="login" class="card">
    <h2>Manager access</h2>
    <p>Enter the files password to continue.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button id="loginBtn" class="btn">Open files</button></div>
    <div id="loginMsg" class="msg err" role="alert"></div>
  </section>

  <!-- App -->
  <section id="app" hidden>
    <div id="drop" class="card" tabindex="0">
      <strong>Drop files here to upload</strong>
      <span>or choose them from your device · up to 50 MB each</span><br>
      <button id="pick" class="btn">Choose files</button>
      <input id="file" type="file" multiple hidden>
    </div>
    <ul id="queue"></ul>

    <div class="list-head">
      <h2>Stored files <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
      <input id="search" type="search" placeholder="Search by name" aria-label="Search files">
    </div>
    <div class="card" style="padding:8px 10px">
      <table>
        <thead>
          <tr><th>Name</th><th class="hide-s">Size</th><th class="hide-s">Uploaded</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No files yet. Upload the first one above.</div>
    </div>
    <div id="appMsg" class="msg" role="status"></div>
  </section>
</main>

<script>
(function(){
  var API = '/api/files';
  var MAX = 50 * 1024 * 1024;
  var KEY = 'starc_files_pw';
  var allFiles = [];

  var $ = function(id){ return document.getElementById(id); };
  var pw = sessionStorage.getItem(KEY) || '';

  function auth(){ return { 'Authorization': 'Bearer ' + pw }; }

  function fmtSize(n){
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    return (n/1048576).toFixed(1) + ' MB';
  }
  function fmtDate(s){
    var d = new Date(s);
    return isNaN(d) ? '' : d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function say(text, cls){
    var el = $('appMsg'); el.textContent = text; el.className = 'msg ' + (cls || '');
  }

  /* ---------- session ---------- */
  function showApp(){
    $('login').hidden = true; $('app').hidden = false; $('logout').hidden = false;
  }
  function showLogin(msg){
    $('app').hidden = true; $('logout').hidden = true; $('login').hidden = false;
    $('loginMsg').textContent = msg || '';
  }

  async function load(){
    var r = await fetch(API, { headers: auth() });
    if (r.status === 401) { throw new Error('auth'); }
    if (!r.ok) { throw new Error('Could not load the files (error ' + r.status + ').'); }
    var data = await r.json();
    allFiles = data.files || [];
    render();
  }

  async function login(){
    pw = $('pw').value;
    if (!pw) { $('loginMsg').textContent = 'Enter the password.'; return; }
    $('loginBtn').disabled = true; $('loginMsg').textContent = '';
    try {
      await load();
      sessionStorage.setItem(KEY, pw);
      showApp();
    } catch(e){
      pw = '';
      showLogin(e.message === 'auth' ? 'Wrong password. Try again.' : (e.message || 'Could not connect.'));
    }
    $('loginBtn').disabled = false;
  }

  $('loginBtn').addEventListener('click', login);
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });
  $('logout').addEventListener('click', function(){
    sessionStorage.removeItem(KEY); pw = ''; $('pw').value = ''; showLogin('');
  });

  /* ---------- list ---------- */
  function render(){
    var q = $('search').value.trim().toLowerCase();
    var list = allFiles.filter(function(f){ return !q || f.name.toLowerCase().indexOf(q) !== -1; });
    var body = $('rows'); body.innerHTML = '';
    list.forEach(function(f){
      var tr = document.createElement('tr');

      var n = document.createElement('td'); n.className = 'name'; n.textContent = f.name;
      var s = document.createElement('td'); s.className = 'meta hide-s'; s.textContent = fmtSize(f.size);
      var d = document.createElement('td'); d.className = 'meta hide-s'; d.textContent = fmtDate(f.uploaded);
      var a = document.createElement('td'); a.className = 'actions';

      var dl = document.createElement('button'); dl.className = 'btn small'; dl.textContent = 'Download';
      dl.addEventListener('click', function(){ download(f, dl); });
      var rm = document.createElement('button'); rm.className = 'btn small danger'; rm.textContent = 'Delete';
      rm.addEventListener('click', function(){ remove(f); });
      a.appendChild(dl); a.appendChild(rm);

      tr.appendChild(n); tr.appendChild(s); tr.appendChild(d); tr.appendChild(a);
      body.appendChild(tr);
    });
    $('empty').hidden = allFiles.length > 0;
    if (allFiles.length && !list.length) { $('empty').hidden = false; $('empty').textContent = 'No file matches your search.'; }
    else { $('empty').textContent = 'No files yet. Upload the first one above.'; }
    $('count').textContent = allFiles.length ? '(' + allFiles.length + ')' : '';
  }
  $('search').addEventListener('input', render);

  /* ---------- download / delete ---------- */
  async function download(f, btn){
    var old = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…'; say('');
    try {
      var r = await fetch(API + '?key=' + encodeURIComponent(f.key), { headers: auth() });
      if (!r.ok) throw new Error('Download failed (error ' + r.status + ').');
      var blob = await r.blob();
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url; link.download = f.name;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    } catch(e){ say(e.message, 'err'); }
    btn.disabled = false; btn.textContent = old;
  }

  async function remove(f){
    if (!confirm('Delete "' + f.name + '"? This cannot be undone.')) return;
    say('');
    try {
      var r = await fetch(API + '?key=' + encodeURIComponent(f.key), { method: 'DELETE', headers: auth() });
      if (!r.ok) throw new Error('Delete failed (error ' + r.status + ').');
      say('Deleted "' + f.name + '".', 'ok');
      await load();
    } catch(e){ say(e.message, 'err'); }
  }

  /* ---------- upload ---------- */
  function uploadOne(file){
    var li = document.createElement('li');
    var nm = document.createElement('span'); nm.textContent = file.name;
    var st = document.createElement('span'); st.textContent = 'Waiting…';
    var bar = document.createElement('div'); bar.className = 'bar'; var fill = document.createElement('i'); bar.appendChild(fill);
    li.appendChild(nm); li.appendChild(st); li.appendChild(bar);
    $('queue').appendChild(li);

    return new Promise(function(resolve){
      function fail(t){ li.className = 'fail'; st.textContent = t; resolve(false); }
      if (file.size === 0) return fail('Empty file');
      if (file.size > MAX) return fail('Over 50 MB');

      var x = new XMLHttpRequest();
      x.open('PUT', API + '?name=' + encodeURIComponent(file.name));
      x.setRequestHeader('Authorization', 'Bearer ' + pw);
      x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      x.upload.onprogress = function(e){
        if (!e.lengthComputable) return;
        var p = Math.round(e.loaded / e.total * 100);
        fill.style.width = p + '%'; st.textContent = p + '%';
      };
      x.onload = function(){
        if (x.status >= 200 && x.status < 300) { li.className = 'done'; fill.style.width = '100%'; st.textContent = 'Uploaded'; resolve(true); }
        else if (x.status === 401) { fail('Session expired'); }
        else { var m = 'Failed (' + x.status + ')'; try { m = JSON.parse(x.responseText).error || m; } catch(e){} fail(m); }
      };
      x.onerror = function(){ fail('Network error'); };
      x.send(file);
    });
  }

  async function uploadMany(files){
    say('');
    var list = Array.prototype.slice.call(files);
    if (!list.length) return;
    $('queue').innerHTML = '';
    var ok = 0;
    for (var i = 0; i < list.length; i++) { if (await uploadOne(list[i])) ok++; }
    if (ok) { say(ok + (ok === 1 ? ' file' : ' files') + ' uploaded.', 'ok'); }
    try { await load(); } catch(e){ if (e.message === 'auth') showLogin('Session expired. Enter the password again.'); }
  }

  var drop = $('drop');
  $('pick').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', function(){ uploadMany(this.files); this.value = ''; });
  drop.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
  ['dragenter','dragover'].forEach(function(t){
    drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(t){
    drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function(e){ uploadMany(e.dataTransfer.files); });

  /* ---------- start ---------- */
  if (pw) {
    load().then(showApp).catch(function(){ sessionStorage.removeItem(KEY); pw = ''; showLogin(''); });
  }
})();
</script>
</body>
</html>
