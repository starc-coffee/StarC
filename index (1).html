<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>StarC — Discount offers | عروض الخصم</title><link rel="stylesheet" href="/services/services.css"></head><body>
<header><div><h1>Discount offers · عروض الخصم</h1><small>Create a coupon · إنشاء قسيمة</small></div>
<div class="hbtns"><a class="hbtn" href="check.html">Check a coupon · فحص قسيمة</a><a class="hbtn" href="/services/">Back · رجوع</a><button class="hbtn" onclick="gateLock()">Lock · قفل</button></div></header>
<main>
 <div class="card">
  <label for="pct">Discount percentage, up to 100% · نسبة الخصم (حتى 100%)</label><input id="pct" type="number" min="1" max="100" value="25">
  <div class="chips" id="pcts"></div>
  <label for="nm">Holder name · اسم حامل القسيمة</label><input id="nm" maxlength="60" placeholder="e.g. Sara Ahmed · مثال: سارة أحمد">
  <label for="vd">Valid until · صالحة حتى</label><input id="vd" type="date">
  <div class="chips" id="dys"></div>
  <div class="err" id="cerr"></div>
  <button class="btn" id="gen" style="width:100%;margin-top:6px">Generate coupon with QR · إنشاء القسيمة مع QR</button>
 </div>
 <div id="result" class="hide card">
  <canvas id="cv" class="cv" width="1080" height="1350"></canvas>
  <div class="chips"><button class="btn" id="dl">Download image · تنزيل الصورة</button><button class="btn ghost" id="cp">Copy check link · نسخ الرابط</button></div>
 </div>
 <div class="card"><div style="display:flex;align-items:center"><b style="flex:1">Recent coupons · آخر القسائم</b><button class="btn ghost" id="rl">Refresh · تحديث</button></div><div id="ls"></div></div>
</main>
<script src="/starc-config.js"></script><script src="/starc-auth.js"></script><script src="/services/gate.js"></script>
<script src="lib/qrcode.js"></script><script src="discount.js"></script>
<script>
var $=function(s){return document.querySelector(s)},cur=null;
function start(){
  $("#vd").min=DC.today();$("#vd").value=DC.addDays(14);
  $("#pcts").innerHTML=[10,25,50,100].map(function(n){return '<button class="btn ghost" data-p="'+n+'">'+n+'%</button>'}).join("");
  $("#dys").innerHTML=[7,14,30,90].map(function(n){return '<button class="btn ghost" data-d="'+n+'">'+n+' days · يوم</button>'}).join("");
  load();
}
document.addEventListener("click",function(e){var p=e.target.getAttribute&&e.target.getAttribute("data-p"),d=e.target.getAttribute&&e.target.getAttribute("data-d");if(p)$("#pct").value=p;if(d)$("#vd").value=DC.addDays(+d)});
function fail(e){$("#cerr").textContent=DC.errText(e);if(e.kind==="auth")gateLock()}
async function load(){
  try{var r=await DC.api({action:"coupon_list"});
    $("#ls").innerHTML=r.coupons.length?r.coupons.map(function(c){return '<div class="li"><div><b>'+DC.esc(c.holder)+'</b><br><span class="note">'+c.percent+'% · '+c.validUntil+' · <span class="code">'+c.code+'</span></span></div><span class="chip '+c.status+'">'+DC.status[c.status]+'</span></div>'}).join(""):'<p class="note">No coupons yet · لا توجد قسائم بعد</p>'}
  catch(e){$("#ls").innerHTML='<p class="err">'+DC.errText(e)+'</p>';if(e.kind==="auth")gateLock()}}
$("#gen").onclick=async function(){
  var p=Math.round(+$("#pct").value),n=$("#nm").value.trim(),v=$("#vd").value;$("#cerr").textContent="";
  if(!(p>=1&&p<=100)||!n||!v||v<DC.today())return $("#cerr").textContent=DC.errText({detail:"invalid"});
  $("#gen").disabled=true;
  try{var r=await DC.api({action:"coupon_create",percent:p,holder:n,validUntil:v});cur=r.coupon;$("#nm").value="";load();$("#result").classList.remove("hide");DC.drawCard($("#cv"),cur);if($("#result").scrollIntoView)$("#result").scrollIntoView({behavior:"smooth"})}
  catch(e){fail(e)}finally{$("#gen").disabled=false}};
$("#dl").onclick=function(){$("#cv").toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="starc-coupon-"+cur.code+".png";a.click()})};
$("#cp").onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(DC.checkUrl(cur.code)).then(function(){$("#cp").textContent="Copied · تم النسخ";setTimeout(function(){$("#cp").textContent="Copy check link · نسخ الرابط"},1500)})};
$("#rl").onclick=load;
StarcGate('manager',start);
</script></body></html>
